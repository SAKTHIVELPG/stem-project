<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>IoT Temperature Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      padding:20px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .header{
      margin-bottom:30px;
    }

    .header h1{
      font-size:40px;
      font-weight:bold;
    }

    .header p{
      color:#94a3b8;
      margin-top:8px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
    }

    .card{
      background:#1e293b;
      border-radius:20px;
      padding:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.3);
    }

    .temp-value{
      font-size:70px;
      font-weight:bold;
      margin-top:20px;
      color:#38bdf8;
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 16px;
      border-radius:50px;
      margin-top:20px;
      font-weight:bold;
    }

    .connected{
      background:#14532d;
      color:#4ade80;
    }

    .disconnected{
      background:#7f1d1d;
      color:#f87171;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      background:currentColor;
    }

    .graph-card{
      margin-top:20px;
    }

    canvas{
      margin-top:20px;
    }

    .settings{
      margin-top:20px;
    }

    .input-group{
      margin-top:20px;
    }

    label{
      display:block;
      margin-bottom:10px;
      color:#cbd5e1;
    }

    input{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#334155;
      color:white;
      font-size:16px;
    }

    button{
      margin-top:20px;
      width:100%;
      padding:16px;
      border:none;
      border-radius:12px;
      background:#0ea5e9;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#0284c7;
    }

    .footer{
      margin-top:40px;
      text-align:center;
      color:#64748b;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>🌡 IoT Temperature Dashboard</h1>
      <p>Real-time ESP32 temperature monitoring system</p>
    </div>

    <div class="grid">

      <!-- TEMPERATURE CARD -->

      <div class="card">

        <h2>Live Temperature</h2>

        <div class="temp-value" id="temperature">
          -- °C
        </div>

        <div id="statusBadge" class="status disconnected">
          <div class="dot"></div>
          Disconnected
        </div>

      </div>

      <!-- SETTINGS -->

      <div class="card settings">

        <h2>Alert Settings</h2>

        <div class="input-group">
          <label>Custom Threshold Temperature</label>

          <input
            type="number"
            id="threshold"
            value="50"
          />
        </div>

        <button onclick="saveThreshold()">
          Save Threshold
        </button>

      </div>

    </div>

    <!-- GRAPH -->

    <div class="card graph-card">

      <h2>Temperature Graph</h2>

      <canvas id="tempChart"></canvas>

    </div>

    <div class="footer">
      IoT Temperature Monitoring System
    </div>

  </div>

<script>

let chart;

let threshold = 50;

async function fetchTemperature(){

  try{

    const res =
      await fetch('/api/temperature');

    const data =
      await res.json();

    document.getElementById("temperature")
      .innerHTML =
      data.temperature.toFixed(1) + " °C";

    // STATUS

    const badge =
      document.getElementById("statusBadge");

    badge.className =
      "status connected";

    badge.innerHTML =
      '<div class="dot"></div> Connected';

    updateGraph(data.history);

    // ALERT

    if(data.temperature >= threshold){

      showNotification(
        data.temperature
      );
    }

  }catch(err){

    const badge =
      document.getElementById("statusBadge");

    badge.className =
      "status disconnected";

    badge.innerHTML =
      '<div class="dot"></div> Disconnected';

  }

}

function updateGraph(history){

  const labels =
    history.map((_,i)=>i+1);

  const values =
    history.map(h=>h.value);

  if(chart){
    chart.destroy();
  }

  const ctx =
    document.getElementById('tempChart');

  chart = new Chart(ctx,{

    type:'line',

    data:{
      labels:labels,

      datasets:[{
        label:'Temperature °C',

        data:values,

        borderColor:'#38bdf8',

        backgroundColor:'rgba(56,189,248,0.2)',

        fill:true,

        tension:0.4,

        pointRadius:3
      }]
    },

    options:{
      responsive:true,

      plugins:{
        legend:{
          labels:{
            color:'white'
          }
        }
      },

      scales:{

        x:{
          ticks:{
            color:'white'
          },

          grid:{
            color:'#334155'
          }
        },

        y:{
          ticks:{
            color:'white'
          },

          grid:{
            color:'#334155'
          }
        }

      }

    }

  });

}

function saveThreshold(){

  threshold =
    Number(
      document.getElementById(
        "threshold"
      ).value
    );

  alert(
    "Threshold Saved: "
    + threshold + "°C"
  );
}

function showNotification(temp){

  if(
    Notification.permission
    === "granted"
  ){

    new Notification(
      "🚨 Temperature Alert",
      {
        body:
          "Temperature reached "
          + temp + "°C"
      }
    );

  }

}

async function enableNotifications(){

  if(Notification.permission !== "granted"){

    await Notification.requestPermission();

  }

}

enableNotifications();

setInterval(fetchTemperature,2000);

fetchTemperature();

</script>

</body>
</html>
