<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>IoT Temperature Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{

  background:
  linear-gradient(
    135deg,
    #0f172a,
    #111827,
    #1e293b
  );

  color:white;

  min-height:100vh;

  padding:20px;

}

.container{
  max-width:1300px;
  margin:auto;
}

.header{

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:30px;

  flex-wrap:wrap;
}

.header h1{
  font-size:42px;
  font-weight:700;
}

.header p{
  color:#94a3b8;
  margin-top:8px;
}

.live-pill{

  display:flex;
  align-items:center;
  gap:10px;

  background:rgba(34,197,94,0.15);

  color:#4ade80;

  padding:12px 18px;

  border-radius:50px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,0.1);
}

.live-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#4ade80;

  box-shadow:0 0 12px #4ade80;
}

.grid{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(300px,1fr));

  gap:20px;
}

.card{

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:28px;

  padding:28px;

  box-shadow:
  0 10px 40px rgba(0,0,0,0.3);

  transition:0.3s;
}

.card:hover{
  transform:translateY(-4px);
}

.card-title{
  color:#cbd5e1;
  font-size:18px;
}

.temp{

  font-size:82px;
  font-weight:800;

  margin-top:20px;

  color:#38bdf8;

  text-shadow:
  0 0 25px rgba(56,189,248,0.4);
}

.status{

  margin-top:20px;

  display:inline-flex;
  align-items:center;
  gap:10px;

  padding:10px 18px;

  border-radius:50px;

  font-weight:bold;
}

.connected{
  background:rgba(34,197,94,0.15);
  color:#4ade80;
}

.disconnected{
  background:rgba(239,68,68,0.15);
  color:#f87171;
}

.dot{

  width:12px;
  height:12px;

  border-radius:50%;

  background:currentColor;
}

.stats{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:15px;

  margin-top:20px;
}

.small-card{

  background:
  rgba(255,255,255,0.05);

  border-radius:20px;

  padding:20px;
}

.small-card h3{
  color:#94a3b8;
  font-size:15px;
}

.small-card p{

  margin-top:10px;

  font-size:30px;
  font-weight:bold;
}

.graph-card{
  margin-top:20px;
}

canvas{
  margin-top:20px;
}

.input-group{
  margin-top:20px;
}

label{

  display:block;

  margin-bottom:10px;

  color:#cbd5e1;
}

input{

  width:100%;

  padding:16px;

  border:none;

  border-radius:16px;

  background:
  rgba(255,255,255,0.08);

  color:white;

  font-size:16px;

  outline:none;
}

button{

  margin-top:20px;

  width:100%;

  padding:16px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #0ea5e9,
    #2563eb
  );

  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;

  transition:0.3s;
}

button:hover{
  transform:scale(1.02);
}

.footer{

  margin-top:40px;

  text-align:center;

  color:#64748b;
}

.updated{

  margin-top:18px;

  color:#94a3b8;

  font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div>

<h1>🌡 IoT Dashboard</h1>

<p>Real-time ESP32 temperature monitoring</p>

</div>

<div class="live-pill">

<div class="live-dot"></div>

LIVE

</div>

</div>

<div class="grid">

<!-- MAIN TEMP -->

<div class="card">

<div class="card-title">
Current Temperature
</div>

<div class="temp" id="temperature">
-- °C
</div>

<div id="statusBadge"
class="status disconnected">

<div class="dot"></div>

Disconnected

</div>

<div class="updated"
id="updatedTime">

Last updated: --

</div>

</div>

<!-- SETTINGS -->

<div class="card">

<div class="card-title">
Alert Settings
</div>

<div class="input-group">

<label>
Custom Threshold
</label>

<input
type="number"
id="threshold"
value="50"
/>

</div>

<button onclick="saveThreshold()">

Save Threshold

</button>

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="small-card">

<h3>Minimum</h3>

<p id="minTemp">--</p>

</div>

<div class="small-card">

<h3>Maximum</h3>

<p id="maxTemp">--</p>

</div>

</div>

<!-- GRAPH -->

<div class="card graph-card">

<div class="card-title">
Live Temperature Graph
</div>

<canvas id="tempChart"></canvas>

</div>

<div class="footer">

ESP32 + DS18B20 Real-time Monitoring

</div>

</div>

<script>

let chart;

let threshold = 50;

async function fetchTemperature(){

  try{

    const res =
    await fetch('/api/temperature');

    const data =
    await res.json();

    const temp =
    data.temperature;

    document.getElementById(
      "temperature"
    ).innerHTML =
    temp.toFixed(1) + "°C";

    // STATUS

    const badge =
    document.getElementById(
      "statusBadge"
    );

    badge.className =
    "status connected";

    badge.innerHTML =
    '<div class="dot"></div> Connected';

    // UPDATED TIME

    document.getElementById(
      "updatedTime"
    ).innerHTML =
    "Last updated: "
    + new Date().toLocaleTimeString();

    // GRAPH

    updateGraph(data.history);

    // MIN MAX

    const values =
    data.history.map(h=>h.value);

    document.getElementById(
      "minTemp"
    ).innerHTML =
    Math.min(...values).toFixed(1)
    + "°C";

    document.getElementById(
      "maxTemp"
    ).innerHTML =
    Math.max(...values).toFixed(1)
    + "°C";

    // ALERT

    if(temp >= threshold){

      showNotification(temp);

    }

  }catch(err){

    const badge =
    document.getElementById(
      "statusBadge"
    );

    badge.className =
    "status disconnected";

    badge.innerHTML =
    '<div class="dot"></div> Disconnected';

  }

}

function updateGraph(history){

  const labels =
  history.map((_,i)=>i+1);

  const values =
  history.map(h=>h.value);

  if(chart){
    chart.destroy();
  }

  const ctx =
  document.getElementById(
    'tempChart'
  );

  chart = new Chart(ctx,{

    type:'line',

    data:{

      labels:labels,

      datasets:[{

        label:'Temperature °C',

        data:values,

        borderColor:'#38bdf8',

        backgroundColor:
        'rgba(56,189,248,0.15)',

        fill:true,

        tension:0.4,

        borderWidth:4,

        pointRadius:2,

        pointBackgroundColor:'#38bdf8'
      }]
    },

    options:{

      responsive:true,

      plugins:{

        legend:{
          labels:{
            color:'white'
          }
        }

      },

      scales:{

        x:{

          ticks:{
            color:'#cbd5e1'
          },

          grid:{
            color:'rgba(255,255,255,0.05)'
          }
        },

        y:{

          ticks:{
            color:'#cbd5e1'
          },

          grid:{
            color:'rgba(255,255,255,0.05)'
          }
        }

      }

    }

  });

}

function saveThreshold(){

  threshold =
  Number(
    document.getElementById(
      "threshold"
    ).value
  );

  alert(
    "Threshold Saved: "
    + threshold + "°C"
  );
}

function showNotification(temp){

  if(Notification.permission === "granted"){

    new Notification(

      "🚨 Temperature Alert",

      {
        body:
        "Temperature reached "
        + temp.toFixed(1)
        + "°C"
      }

    );

  }

}

async function enableNotifications(){

  if(Notification.permission !== "granted"){

    await Notification.requestPermission();

  }

}

enableNotifications();

setInterval(fetchTemperature,2000);

fetchTemperature();

</script>

</body>
</html>
